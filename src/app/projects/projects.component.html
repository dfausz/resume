<div>
    <div id="projects-section" class="projects-title section-title">
        <span class="section-title-slashes">//</span> Projects
    </div>
    <div class="carousel-container" 
         #carouselContainer
         (touchstart)="onTouchStart($event)"
         (touchmove)="onTouchMove($event)"
         (touchend)="onTouchEnd($event)">
      <div class="carousel-track" 
           [style.transform]="'translateX(' + translateX + 'px)'"
           [style.transition]="isTransitioning ? 'transform 0.3s ease' : 'none'">
        @for (project of projects; track $index) {
          <div class="carousel-item">
            <article class="project-card">
                <div class="title">{{project.title}}</div>
                <p class="tagline">{{project.tagline}}</p>
                <p class="description">{{project.description}}</p>
                <ul class="bullets">
                    @for (bullet of project.bullets; track $index) {
                        <li>{{bullet}}</li>
                    }
                </ul>
                <p><a href="project.link" target="_blank" rel="noopener">View source on GitHub</a></p>
              </article>
              
          </div>
        }
      </div>
      <button class="nav-btn prev" (click)="prev()" [disabled]="currentIndex === 0">‹</button>
      <button class="nav-btn next" (click)="next()" [disabled]="currentIndex >= projects.length - 1">›</button>
      
      <div class="indicators">
        @for (project of projects; track $index) {
          <button class="indicator" 
                  [class.active]="$index === currentIndex"
                  (click)="goToSlide($index)">
          </button>
        }
      </div>
    </div>
</div>
